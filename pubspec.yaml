name: al_amin

description: "Al Amin Baitul Maal accounting application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # File handling
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  cross_file: ^0.3.5+5

  # PDF / printing
  pdf: ^3.13.1
  printing: ^5.15.1

  # Sharing
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/BAckground.jpg
    - assets/al_amin_logo.png